version = 1
exclude_paths = []

[vars]
source_root = "src"
okf_root = "okf-generated"

[retry]
max_attempts = 3
initial_delay_seconds = 1
backoff_multiplier = 2
max_delay_seconds = 10

[[steps]]
id = "questions"
prompt_file = "flow/okf/prompts/questions_generate.md"
output = "flow/okf/flow_okf_from_src/state/questions.json"
overwrite_output = false
workspace_access = "read"
response_format = "json"

[steps.vars]
source_kind = "source code"

[[steps]]
id = "settings"
prompt_file = "flow/okf/flow_okf_from_src/prompts/12_question_settings.md"
workspace_access = "none"
response_format = "json"

[[steps]]
id = "process_questions"
flow = "flow/okf/flow_okf_from_src/flows/process-question.toml"
foreach = "steps.questions.output.questions"

[steps.input]
question = "${item}"
question_id = "${iteration.id}"
source_root = "${steps.settings.output.source_root}"
okf_root = "${steps.settings.output.okf_root}"
