version = 1

# Workspace-relative roots. source_root selects the source tree to document;
# okf_root is where the generated OKF repository is written.
[vars]
source_root = "src"
okf_root = "okf-generated"

[retry]
max_attempts = 3
initial_delay_seconds = 1
backoff_multiplier = 2
max_delay_seconds = 10

[[steps]]
id = "partition"
prompt_file = "flow/okf/flow_okf_from_src/prompts/01_partition.md"
output = "flow/okf/flow_okf_from_src/state/partition.json"
overwrite_output = true
workspace_access = "read"
response_format = "json"

[[steps]]
id = "inventory_units"
prompt_file = "flow/okf/flow_okf_from_src/prompts/02_inventory_unit.md"
foreach = "steps.partition.output.units"
iteration_id = "${item.id}"
output = "flow/okf/flow_okf_from_src/state/inventory-${iteration.id}.json"
overwrite_output = true
workspace_access = "read"
response_format = "json"

[steps.vars]
unit = "${item}"

[[steps]]
id = "plan_units"
prompt_file = "flow/okf/flow_okf_from_src/prompts/03_plan_unit.md"
add_file_context = ["flow/okf/okf-format.md"]
foreach = "steps.inventory_units.output.iterations"
iteration_id = "${item.id}"
output = "flow/okf/flow_okf_from_src/state/plan-${iteration.id}.json"
overwrite_output = true
workspace_access = "read"
response_format = "json"

[steps.vars]
inventory = "${item.output}"

[[steps]]
id = "build_units"
prompt_file = "flow/okf/flow_okf_from_src/prompts/04_build_concept.md"
add_file_context = ["flow/okf/okf-format.md"]
conversation_items = "${item.output.concepts}"
conversation_final_prompt_file = "flow/okf/flow_okf_from_src/prompts/05_build_unit_final.md"
foreach = "steps.plan_units.output.iterations"
iteration_id = "${item.id}"
output = "flow/okf/flow_okf_from_src/state/build-${iteration.id}.json"
overwrite_output = true
workspace_access = "write"
response_format = "json"
approve_tools = ["os__make_directory", "os__write_file"]

[steps.vars]
unit_plan = "${item.output}"
concept = "${conversation.item}"

[[steps]]
id = "verify_units"
prompt_file = "flow/okf/flow_okf_from_src/prompts/06_verify_unit.md"
add_file_context = ["flow/okf/okf-format.md"]
foreach = "steps.build_units.output.iterations"
iteration_id = "${item.id}"
output = "flow/okf/flow_okf_from_src/state/verify-${iteration.id}.json"
overwrite_output = true
workspace_access = "read"
response_format = "json"

[steps.vars]
build = "${item.output}"

[[steps]]
id = "repair_units"
prompt_file = "flow/okf/flow_okf_from_src/prompts/07_repair_unit.md"
add_file_context = ["flow/okf/okf-format.md"]
foreach = "steps.verify_units.output.iterations"
iteration_id = "${item.id}"
output = "flow/okf/flow_okf_from_src/state/repair-${iteration.id}.json"
overwrite_output = true
workspace_access = "write"
response_format = "json"
approve_tools = ["os__make_directory", "os__write_file"]

[steps.vars]
verification = "${item.output}"

# This JSON file is deliberately resumable/editable. On the first run the model
# generates coverage candidates. Before a later run, users can add their own
# {id,name,description,...} entries; the existing valid JSON is then used as a
# checkpoint instead of being overwritten.
[[steps]]
id = "additional_concepts"
prompt_file = "flow/okf/flow_okf_from_src/prompts/08_additional_concepts.md"
add_file_context = ["flow/okf/okf-format.md"]
output = "flow/okf/flow_okf_from_src/state/additional-concepts.json"
overwrite_output = false
workspace_access = "read"
response_format = "json"

[steps.vars]
unit_plans = "${steps.plan_units.output.iterations}"
unit_results = "${steps.repair_units.output.iterations}"

[[steps]]
id = "assess_additional_concepts"
prompt_file = "flow/okf/flow_okf_from_src/prompts/09_assess_additional_concept.md"
add_file_context = ["flow/okf/okf-format.md"]
foreach = "steps.additional_concepts.output.concepts"
iteration_id = "${item.id}"
output = "flow/okf/flow_okf_from_src/state/assess-${iteration.id}.json"
overwrite_output = true
workspace_access = "read"
response_format = "json"

[steps.vars]
requested_concept = "${item}"

[[steps]]
id = "apply_additional_concepts"
prompt_file = "flow/okf/flow_okf_from_src/prompts/10_apply_additional_concept.md"
add_file_context = ["flow/okf/okf-format.md"]
foreach = "steps.assess_additional_concepts.output.iterations"
iteration_id = "${item.id}"
output = "flow/okf/flow_okf_from_src/state/apply-${iteration.id}.json"
overwrite_output = true
workspace_access = "write"
response_format = "json"
approve_tools = ["os__make_directory", "os__write_file"]

[steps.vars]
assessment = "${item.output}"

[[steps]]
id = "create_root_index"
prompt_file = "flow/okf/flow_okf_from_src/prompts/11_create_root_index.md"
add_file_context = ["flow/okf/okf-format.md"]
output = "flow/okf/flow_okf_from_src/state/root-index.json"
overwrite_output = true
workspace_access = "write"
response_format = "json"
approve_tools = ["os__make_directory", "os__write_file"]

[steps.vars]
project = "${steps.partition.output.project}"
units = "${steps.repair_units.output.iterations}"
additional_changes = "${steps.apply_additional_concepts.output.iterations}"

[[steps]]
id = "final_verify"
prompt_file = "flow/okf/flow_okf_from_src/prompts/12_final_verify.md"
add_file_context = ["flow/okf/okf-format.md"]
output = "flow/okf/flow_okf_from_src/state/final-verification.json"
overwrite_output = true
workspace_access = "read"
response_format = "json"

[steps.vars]
root_index = "${steps.create_root_index.output}"
