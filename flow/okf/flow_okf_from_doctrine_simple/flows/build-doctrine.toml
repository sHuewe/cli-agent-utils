version = 1
inputs = ["source", "okf_root"]
result = "steps.manifest.output"

# Inspect Markdown structure without a model. Short doctrines keep direct planning.
[[steps]]
id = "sections"
output = "flow/okf/flow_okf_from_doctrine_simple/state/modules/${input.source.path}/sections.json"
overwrite_output = false
[steps.filesystem_operation]
kind = "markdown_sections"
source_path = "${input.source.path}"
target_chars = 30000
max_sections = 32

# Only long doctrines have section work; each analysis has its own checkpoint.
[[steps]]
id = "section_analysis"
prompt_file = "flow/okf/flow_okf_from_doctrine_simple/prompts/00_analyze_section.md"
foreach = "steps.sections.output.sections"
iteration_id = "${item.id}"
output = "flow/okf/flow_okf_from_doctrine_simple/state/modules/${input.source.path}/section-${iteration.id}.json"
overwrite_output = false
workspace_access = "read"
response_format = "json"
[steps.vars]
source = "${input.source}"
section = "${item}"

# Build bounded outline tasks: each gets only its own section analysis.
[[steps]]
id = "outline_tasks"
output = "flow/okf/flow_okf_from_doctrine_simple/state/modules/${input.source.path}/outline-tasks.json"
overwrite_output = false
[steps.json_operation]
kind = "prepare_outline_tasks"
input = "sections"
results_step = "section_analysis"
[steps.json_inputs.sections]
path = "flow/okf/flow_okf_from_doctrine_simple/state/modules/${input.source.path}/sections.json"

# Each model request sees one section, or the short original document.
[[steps]]
id = "local_outlines"
prompt_file = "flow/okf/flow_okf_from_doctrine_simple/prompts/01_plan_section.md"
foreach = "steps.outline_tasks.output.tasks"
iteration_id = "${item.id}"
output = "flow/okf/flow_okf_from_doctrine_simple/state/modules/${input.source.path}/local-outline-${iteration.id}.json"
overwrite_output = false
workspace_access = "read"
response_format = "json"
[steps.vars]
source = "${input.source}"
task = "${item}"

# No global LLM request: repeated topic_keys are combined deterministically.
[[steps]]
id = "outline"
output = "flow/okf/flow_okf_from_doctrine_simple/state/modules/${input.source.path}/outline.json"
overwrite_output = false
[steps.json_operation]
kind = "assemble_section_outlines"
input = "tasks"
results_step = "local_outlines"
batches_step = "outline_tasks"
expected_source_path = "${input.source.path}"
expected_source_slug = "${input.source.slug}"
[steps.json_inputs.tasks]
path = "flow/okf/flow_okf_from_doctrine_simple/state/modules/${input.source.path}/outline-tasks.json"

# Deterministic grouping: at most 3 concepts per detail-planning request.
[[steps]]
id = "plan_batches"
output = "flow/okf/flow_okf_from_doctrine_simple/state/modules/${input.source.path}/plan-batches.json"
overwrite_output = false
[steps.json_operation]
kind = "prepare_doctrine_batches"
input = "outline"
results_step = "section_analysis"
batch_size = 3
[steps.json_inputs.outline]
path = "flow/okf/flow_okf_from_doctrine_simple/state/modules/${input.source.path}/outline.json"

# Independent detail checkpoints: any completed batch survives a later timeout.
[[steps]]
id = "plan_details"
prompt_file = "flow/okf/flow_okf_from_doctrine_simple/prompts/01_detail_concepts.md"
foreach = "steps.plan_batches.output.batches"
iteration_id = "${item.id}"
output = "flow/okf/flow_okf_from_doctrine_simple/state/modules/${input.source.path}/plan-detail-${iteration.id}.json"
overwrite_output = false
workspace_access = "read"
response_format = "json"
[steps.vars]
source = "${input.source}"
batch = "${item}"

# No LLM is used to combine the results: preserve the original plan.json.
[[steps]]
id = "plan"
output = "flow/okf/flow_okf_from_doctrine_simple/state/modules/${input.source.path}/plan.json"
overwrite_output = false
[steps.json_operation]
kind = "assemble_doctrine_plan"
input = "outline"
results_step = "plan_details"
batches_step = "plan_batches"
[steps.json_inputs.outline]
path = "flow/okf/flow_okf_from_doctrine_simple/state/modules/${input.source.path}/outline.json"

# Only the planned concepts are generated; no atomic item routing.
[[steps]]
id = "validate_plan"
output = "flow/okf/flow_okf_from_doctrine_simple/state/modules/${input.source.path}/validated-plan.json"
overwrite_output = false
[steps.json_operation]
kind = "validate_okf_plan"
input = "plan"
plan_kind = "doctrine"
expected_source_path = "${input.source.path}"
expected_source_slug = "${input.source.slug}"
[steps.json_inputs.plan]
path = "flow/okf/flow_okf_from_doctrine_simple/state/modules/${input.source.path}/plan.json"

[[steps]]
id = "concepts"
flow = "flow/okf/flow_okf_from_doctrine_simple/flows/build-concept.toml"
foreach = "steps.validate_plan.output.concepts"
iteration_id = "${item.id}"
[steps.input]
source = "${input.source}"
concept = "${item}"
okf_root = "${input.okf_root}"

# One navigation task writes the doctrine index and subfolder indices.
[[steps]]
id = "navigation"
prompt_file = "flow/okf/flow_okf_from_doctrine_simple/prompts/04_write_navigation.md"
output = "flow/okf/flow_okf_from_doctrine_simple/state/modules/${input.source.path}/navigation.json"
overwrite_output = false
workspace_access = "write"
response_format = "json"
approve_tools = ["os__make_directory", "os__write_file", "os__move_file", "os__copy_file", "os__delete_file"]
[steps.vars]
plan = "${steps.validate_plan.output}"
concept_results = "${steps.concepts.output.iterations}"
okf_root = "${input.okf_root}"

# One small manifest for cross-doctrine topic discovery.
[[steps]]
id = "manifest"
output = "flow/okf/flow_okf_from_doctrine_simple/state/modules/${input.source.path}/manifest.json"
overwrite_output = false
[steps.json_operation]
kind = "build_okf_manifest"
input = "plan"
expected_source_path = "${input.source.path}"
[steps.json_inputs.plan]
path = "flow/okf/flow_okf_from_doctrine_simple/state/modules/${input.source.path}/validated-plan.json"
[steps.json_inputs.navigation]
path = "flow/okf/flow_okf_from_doctrine_simple/state/modules/${input.source.path}/navigation.json"
