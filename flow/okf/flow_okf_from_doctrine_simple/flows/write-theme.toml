version = 1
inputs = ["theme", "okf_root"]
result = "steps.write.output"

[[steps]]
id = "write"
prompt_file = "flow/okf/flow_okf_from_doctrine_simple/prompts/07_write_theme.md"
output = "flow/okf/flow_okf_from_doctrine_simple/state/global/theme-${input.theme.id}.json"
overwrite_output = false
workspace_access = "write"
response_format = "json"
approve_tools = ["os__make_directory", "os__write_file"]
[steps.vars]
theme = "${input.theme}"
okf_root = "${input.okf_root}"
