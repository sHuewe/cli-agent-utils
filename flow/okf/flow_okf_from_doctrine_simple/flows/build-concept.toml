version = 1
inputs = ["source", "concept", "okf_root"]

# Verification is the fallback when no repair is necessary.
result = "steps.repair.output"
result_fallback = "steps.verify.output"

[[steps]]
id = "build"
prompt_file = "flow/okf/flow_okf_from_doctrine_simple/prompts/02_build_concept.md"
add_file_context = ["flow/okf/okf-format.md"]
output = "flow/okf/flow_okf_from_doctrine_simple/state/modules/${input.source.path}/concept-${input.concept.id}-build.json"
overwrite_output = false
workspace_access = "write"
response_format = "json"
approve_tools = ["os__make_directory", "os__write_file", "os__move_file", "os__copy_file", "os__delete_file"]
[steps.vars]
source = "${input.source}"
concept = "${input.concept}"
okf_root = "${input.okf_root}"

[[steps]]
id = "verify"
prompt_file = "flow/okf/flow_okf_from_doctrine_simple/prompts/03_verify_concept.md"
add_file_context = ["flow/okf/okf-format.md"]
output = "flow/okf/flow_okf_from_doctrine_simple/state/modules/${input.source.path}/concept-${input.concept.id}-verify.json"
overwrite_output = false
workspace_access = "read"
response_format = "json"
[steps.vars]
source = "${input.source}"
concept = "${input.concept}"
build = "${steps.build.output}"
okf_root = "${input.okf_root}"

[[steps]]
id = "repair"
when = { ref = "steps.verify.output.status", eq = "needs_repair" }
prompt_file = "flow/okf/flow_okf_from_doctrine_simple/prompts/03b_repair_concept.md"
add_file_context = ["flow/okf/okf-format.md"]
output = "flow/okf/flow_okf_from_doctrine_simple/state/modules/${input.source.path}/concept-${input.concept.id}-repair.json"
overwrite_output = false
workspace_access = "write"
response_format = "json"
approve_tools = ["os__make_directory", "os__write_file", "os__move_file", "os__copy_file", "os__delete_file"]
[steps.vars]
source = "${input.source}"
concept = "${input.concept}"
verification = "${steps.verify.output}"
okf_root = "${input.okf_root}"
