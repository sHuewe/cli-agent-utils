version = 1
inputs = ["registry", "okf_root", "batch_id"]
result = "steps.audit.output"

[[steps]]
id = "themes"
flow = "flow/okf/flow_okf_from_doctrine_batched/flows/build-theme.toml"
foreach = "input.registry.themes"
iteration_id = "${item.id}"
[steps.input]
theme = "${item}"
okf_root = "${input.okf_root}"

[[steps]]
id = "audit"
output_schema = "flow/okf/flow_okf_from_doctrine_batched/schemas/shard-audit.schema.json"
prompt_file = "flow/okf/flow_okf_from_doctrine_batched/prompts/12_shard_audit.md"
output = "okf-batched/state-v3/global/audit-${input.batch_id}.json"
overwrite_output = false
workspace_access = "none"
response_format = "json"
[steps.vars]
batch_id = "${input.batch_id}"
registry = "${input.registry}"
theme_results = "${steps.themes.output.iterations}"
