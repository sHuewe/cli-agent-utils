version = 1
inputs = ["source", "concepts"]
result = "steps.coverage.output"

[[steps]]
id = "coverage"
output = "okf-batched/state-v3/docs/${input.source.slug}/coverage.json"
overwrite_output = false
[steps.json_operation]
kind = "verify_coverage"
input = "plan"
[steps.json_inputs.plan]
path = "okf-batched/state-v3/docs/${input.source.slug}/group.json"
[steps.json_inputs.results]
iterate = "input.concepts[]"
path = "okf-batched/state-v3/docs/${input.source.slug}/concept-${each.id}-repair.json"

