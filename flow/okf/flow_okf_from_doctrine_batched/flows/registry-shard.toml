version = 1
inputs = ["batch"]
result = "steps.validate.output"

[[steps]]
id = "registry"
prompt_file = "flow/okf/flow_okf_from_doctrine_batched/prompts/08_registry.md"
output = "okf-batched/state-v3/global/registry-${input.batch.id}.json"
overwrite_output = false
workspace_access = "none"
response_format = "json"
[steps.vars]
batch = "${input.batch}"

# Generic, fail-closed ID and membership-set partition validation.
# Every OKF-specific selector and eligibility threshold is defined here.
# IMPORTANT: source_input references this subflow's declared input.batch
# (supplied by global-topics.toml's [steps.input]), NOT a json_inputs key.
# The runner reads flow_input[operation["source_input"]] independently of
# json_inputs.registry, which supplies the LLM-generated registry result.
[[steps]]
id = "validate"
output = "okf-batched/state-v3/global/validated-registry-${input.batch.id}.json"
overwrite_output = false
[steps.json_operation]
kind = "json_validate_partition"
input = "registry"
source_input = "batch"
source_path = "/items/*/groups/*"
reference_template = "i{0:04d}-g{1:04d}"
distinct_path = "/members/*/source_slug"
min_distinct = 2
selected_path = "/themes/*"
references_path = "/group_refs/*"
excluded_path = "/excluded_group_refs/*"
source_members_path = "/members/*"
result_members_path = "/members/*"
result_id_path = "/id"
result_id_pattern = '^[a-z][a-z0-9-]*$'
result_path_field = "/path"
result_path_template = "themen/{id}.md"
source_status_path = "/status"
source_warnings_path = "/warnings"
result_status_path = "/status"
result_warnings_path = "/warnings"
member_fields = ["/source_slug", "/path"]
[steps.json_operation.member_patterns]
"/source_slug" = '^[a-z0-9]+(?:-[a-z0-9]+)*$'
"/path" = '^doctrines/[a-z0-9]+(?:-[a-z0-9]+)*/(?:[a-z0-9]+(?:-[a-z0-9]+)*/)?[a-z0-9]+(?:-[a-z0-9]+)*\.md$'
[steps.json_inputs.registry]
path = "okf-batched/state-v3/global/registry-${input.batch.id}.json"
