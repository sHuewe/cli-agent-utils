version = 1
inputs = ["source", "concept", "okf_root", "concept_id_options", "concept_path_options", "concept_result_path_options", "source_slug_options", "source_path_options"]
result = "steps.manifest.output"

[[steps]]
id = "build"
output_schema = "flow/okf/flow_okf_from_doctrine_batched/schemas/concept-build.schema.json"
prompt_file = "flow/okf/flow_okf_from_doctrine/prompts/08_build_concept.md"
add_file_context = ["flow/okf/okf-format.md"]
output = "okf-batched/state-v3/docs/${input.source.slug}/concept-${input.concept.id}-build.json"
overwrite_output = false
workspace_access = "write"
response_format = "json"
approve_tools = ["os__make_directory", "os__write_file"]
[steps.tool_policy]
allowed_tools = ["os__read_file", "os__write_file", "os__make_directory"]
write_paths = ["${input.okf_root}/${input.concept.path}"]
[steps.vars]
concept = "${input.concept}"
okf_root = "${input.okf_root}"

[steps.output_schema_enums]
"/properties/concept_id" = "input.concept_id_options"
"/properties/path" = "input.concept_result_path_options"

[[steps]]
id = "verify"
output_schema = "flow/okf/flow_okf_from_doctrine_batched/schemas/concept-verify.schema.json"
prompt_file = "flow/okf/flow_okf_from_doctrine/prompts/09_verify_concept.md"
add_file_context = ["flow/okf/okf-format.md"]
output = "okf-batched/state-v3/docs/${input.source.slug}/concept-${input.concept.id}-verify.json"
overwrite_output = false
workspace_access = "read"
response_format = "json"
[steps.tool_policy]
allowed_tools = ["os__read_file"]
[steps.vars]
concept = "${input.concept}"
build = "${steps.build.output}"
okf_root = "${input.okf_root}"

[steps.output_schema_enums]
"/properties/concept_id" = "input.concept_id_options"
"/properties/path" = "input.concept_result_path_options"

[[steps]]
id = "repair"
output_schema = "flow/okf/flow_okf_from_doctrine_batched/schemas/concept-repair.schema.json"
prompt_file = "flow/okf/flow_okf_from_doctrine/prompts/10_repair_concept.md"
add_file_context = ["flow/okf/okf-format.md"]
output = "okf-batched/state-v3/docs/${input.source.slug}/concept-${input.concept.id}-repair.json"
overwrite_output = false
workspace_access = "write"
response_format = "json"
approve_tools = ["os__write_file"]
[steps.tool_policy]
allowed_tools = ["os__read_file", "os__write_file"]
write_paths = ["${input.okf_root}/${input.concept.path}"]
[steps.vars]
concept = "${input.concept}"
verification = "${steps.verify.output}"
okf_root = "${input.okf_root}"

# A very short per-CONCEPT semantic profile for bounded global matching.

[steps.output_schema_enums]
"/properties/concept_id" = "input.concept_id_options"
"/properties/path" = "input.concept_result_path_options"

[[steps]]
id = "manifest"
output_schema = "flow/okf/flow_okf_from_doctrine_batched/schemas/concept-manifest.schema.json"
prompt_file = "flow/okf/flow_okf_from_doctrine_batched/prompts/04_concept_manifest.md"
output = "okf-batched/state-v3/docs/${input.source.slug}/manifests/concept-${input.concept.id}.json"
overwrite_output = false
workspace_access = "none"
response_format = "json"
[steps.vars]
source = "${input.source}"
concept = "${input.concept}"
repair = "${steps.repair.output}"

[steps.output_schema_enums]
"/properties/source_slug" = "input.source_slug_options"
"/properties/source_path" = "input.source_path_options"
"/properties/concepts/items/properties/source_slug" = "input.source_slug_options"
"/properties/concepts/items/properties/source_path" = "input.source_path_options"
"/properties/concepts/items/properties/path" = "input.concept_path_options"

