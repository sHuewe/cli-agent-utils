version = 1
inputs = ["source", "sections", "scans", "outline", "okf_root"]
result = "steps.final_manifest_inventory.output"

[[steps]]
id = "taxonomy_profile"
output = "okf-batched/state-v3/docs/${input.source.slug}/taxonomy-profile.json"
overwrite_output = false
[steps.json_operation]
kind = "doctrine_taxonomy_profile"
input = "outline"
[steps.json_inputs.outline]
path = "okf-batched/state-v3/docs/${input.source.slug}/outline.json"

[[steps]]
id = "taxonomy"
output_schema = "flow/okf/flow_okf_from_doctrine_batched/schemas/taxonomy.schema.json"
prompt_file = "flow/okf/flow_okf_from_doctrine_batched/prompts/02_taxonomy.md"
output = "okf-batched/state-v3/docs/${input.source.slug}/taxonomy.json"
overwrite_output = false
workspace_access = "none"
response_format = "json"
[steps.vars]
source = "${input.source}"
profile = "${steps.taxonomy_profile.output}"

# Existing deterministic semantic-neighbor grouping from cli-agent:
# no entire doctrine in an LLM request, just 6 compact topic summaries.
[[steps]]
id = "consolidation_batches"
output = "okf-batched/state-v3/docs/${input.source.slug}/consolidation-batches.json"
overwrite_output = false
[steps.json_operation]
kind = "prepare_doctrine_consolidation"
input = "outline"
batch_size = 6
[steps.json_inputs.outline]
path = "okf-batched/state-v3/docs/${input.source.slug}/outline.json"
[steps.json_inputs.taxonomy]
path = "okf-batched/state-v3/docs/${input.source.slug}/taxonomy.json"

[[steps]]
id = "consolidate"
output_schema = "flow/okf/flow_okf_from_doctrine_batched/schemas/consolidation.schema.json"
prompt_file = "flow/okf/flow_okf_from_doctrine_batched/prompts/03_consolidate.md"
foreach = "steps.consolidation_batches.output.batches"
iteration_id = "${item.id}"
output = "okf-batched/state-v3/docs/${input.source.slug}/consolidation-${iteration.id}.json"
overwrite_output = false
workspace_access = "none"
response_format = "json"
[steps.vars]
batch = "${item}"

# Retain the original consolidate step, file paths and checkpoints. Validate
# each completed batch deterministically; call the LLM only for invalid
# folder assignments and revalidate corrected results before assembly.
[[steps]]
id = "validated_batches"
flow = "flow/okf/flow_okf_from_doctrine_batched/flows/validate-consolidation.toml"
foreach = "steps.consolidate.output.iterations"
iteration_id = "${item.id}"
[steps.input]
source_slug = "${input.source.slug}"
batch_id = "${item.id}"

# Validates exact one-to-one membership of every original topic candidate.
[[steps]]
id = "consolidated"
output = "okf-batched/state-v3/docs/${input.source.slug}/consolidated.json"
overwrite_output = false
[steps.json_operation]
kind = "assemble_doctrine_consolidation"
input = "outline"
results_step = "validated_batches"
batches_step = "consolidation_batches"
[steps.json_inputs.outline]
path = "okf-batched/state-v3/docs/${input.source.slug}/outline.json"
[steps.json_inputs.taxonomy]
path = "okf-batched/state-v3/docs/${input.source.slug}/taxonomy.json"

# Schema-neutral ID joins: the runner knows only JSON selectors and aliases.
# The OKF-specific field names live exclusively in this declarative config.
[[steps]]
id = "assign"
output = "okf-batched/state-v3/docs/${input.source.slug}/assign.json"
overwrite_output = false
[steps.json_operation]
kind = "json_join_aliases"
input = "items"
items_path = "/*/knowledge_items/*"
item_id_path = "/id"
item_key_path = "/topic_key"
mapping_path = "/concepts/*"
mapping_id_path = "/id"
mapping_alias_path = "/merged_from/*"
id_prefix = "${input.source.slug}:"
require_all_aliases = true
[steps.json_inputs.items]
iterate = "input.scans.iterations[]"
path = "okf-batched/state-v3/docs/${input.source.slug}/scan-${each.id}.json"
[steps.json_inputs.mapping]
path = "okf-batched/state-v3/docs/${input.source.slug}/consolidated.json"

[[steps]]
id = "topics"
output = "okf-batched/state-v3/docs/${input.source.slug}/topics.json"
overwrite_output = false
[steps.json_operation]
kind = "json_project"
input = "consolidated"
[steps.json_operation.fields]
folder = "/folder"
folders = "/folders"
topics = "/concepts"
[steps.json_inputs.consolidated]
path = "okf-batched/state-v3/docs/${input.source.slug}/consolidated.json"

# Reuse the existing (older) deterministic group_items operation,
# without a new doctrine-specific join or validation in the runner.
[[steps]]
id = "group"
output = "okf-batched/state-v3/docs/${input.source.slug}/group.json"
overwrite_output = false
[steps.json_operation]
kind = "group_items"
input = "assignments"
max_concept_bytes = 12000
[steps.json_inputs.routes]
iterate = "input.scans.iterations[]"
path = "okf-batched/state-v3/docs/${input.source.slug}/scan-${each.id}.json"
[steps.json_inputs.assignments]
path = "okf-batched/state-v3/docs/${input.source.slug}/assign.json"
[steps.json_inputs.topics]
path = "okf-batched/state-v3/docs/${input.source.slug}/topics.json"

[[steps]]
id = "build_concepts"
flow = "flow/okf/flow_okf_from_doctrine_batched/flows/build-concept.toml"
foreach = "steps.group.output.concepts"
iteration_id = "${item.id}"
[steps.input]
source = "${input.source}"
concept = "${item}"
okf_root = "${input.okf_root}"
concept_id_options = ["${item.id}"]
concept_path_options = ["${item.path}"]
source_slug_options = ["${input.source.slug}"]
source_path_options = ["${input.source.path}"]

[[steps]]
id = "coverage"
flow = "flow/okf/flow_okf_from_doctrine_batched/flows/verify-document.toml"
[steps.input]
source = "${input.source}"
concepts = "${steps.group.output.concepts}"

# A compact coverage manifest is consumed by the global reduction alongside
# concept manifests; incomplete source coverage is never invisible.
[[steps]]
id = "coverage_manifest"
output_schema = "flow/okf/flow_okf_from_doctrine_batched/schemas/coverage-manifest.schema.json"
prompt_file = "flow/okf/flow_okf_from_doctrine_batched/prompts/05_coverage_manifest.md"
output = "okf-batched/state-v3/docs/${input.source.slug}/manifests/coverage.json"
overwrite_output = false
workspace_access = "none"
response_format = "json"
[steps.vars]
source = "${input.source}"
coverage = "${steps.coverage.output}"

[[steps]]
id = "manifest_inventory"
output = "okf-batched/state-v3/docs/${input.source.slug}/manifest-inventory.json"
overwrite_output = true
[steps.filesystem_operation]
kind = "inventory"
directory = "okf-batched/state-v3/docs/${input.source.slug}/manifests"
recursive = false
extensions = [".json"]
max_entries = 1000

[[steps]]
id = "folder_indexes"
flow = "flow/okf/flow_okf_from_doctrine_batched/flows/index-folder.toml"
foreach = "steps.group.output.folders"
iteration_id = "${item.id}"
[steps.input]
source = "${input.source}"
folder = "${item}"
okf_root = "${input.okf_root}"
coverage = "${steps.coverage.output}"

[[steps]]
id = "module_index"
output_schema = "flow/okf/flow_okf_from_doctrine_batched/schemas/module-index.schema.json"
prompt_file = "flow/okf/flow_okf_from_doctrine_batched/prompts/06_module_index.md"
output = "okf-batched/state-v3/docs/${input.source.slug}/module-index.json"
overwrite_output = false
workspace_access = "write"
response_format = "json"
approve_tools = ["os__make_directory", "os__write_file"]
[steps.vars]
source = "${input.source}"
okf_root = "${input.okf_root}"
coverage = "${steps.coverage.output}"
manifest_inventory = "${steps.manifest_inventory.output}"
folder_indexes = "${steps.folder_indexes.output.iterations}"
folders = "${steps.group.output.folders}"


# Make navigation failures visible to GLOBAL topic reductions, not just to
# local flow logs. This is a short status-only model call.
[[steps]]
id = "navigation_manifest"
output_schema = "flow/okf/flow_okf_from_doctrine_batched/schemas/coverage-manifest.schema.json"
prompt_file = "flow/okf/flow_okf_from_doctrine_batched/prompts/07_navigation_manifest.md"
output = "okf-batched/state-v3/docs/${input.source.slug}/manifests/navigation.json"
overwrite_output = false
workspace_access = "none"
response_format = "json"
[steps.vars]
source = "${input.source}"
coverage = "${steps.coverage.output}"
module_index = "${steps.module_index.output}"
folder_indexes = "${steps.folder_indexes.output.iterations}"

[[steps]]
id = "final_manifest_inventory"
output = "okf-batched/state-v3/docs/${input.source.slug}/final-manifest-inventory.json"
overwrite_output = true
[steps.filesystem_operation]
kind = "inventory"
directory = "okf-batched/state-v3/docs/${input.source.slug}/manifests"
recursive = false
extensions = [".json"]
max_entries = 1000
