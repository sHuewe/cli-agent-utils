version = 1
inputs = ["source", "okf_root"]
result = "steps.finish.output"

# New state namespace: section->concept planning changed fundamentally.
# Golden checkpoints are separate and deliberately unaffected.
[[steps]]
id = "sections"
output = "okf-batched/state-v2/docs/${input.source.slug}/sections.json"
overwrite_output = false
[steps.filesystem_operation]
kind = "markdown_sections"
source_path = "${input.source.path}"
target_chars = 5000
max_sections = 512

# Uniform deterministic tasks, including a single direct task for short docs.
[[steps]]
id = "scan_tasks"
output = "okf-batched/state-v2/docs/${input.source.slug}/scan-tasks.json"
overwrite_output = false
[steps.json_operation]
kind = "prepare_okf_scan_tasks"
input = "sections"
[steps.json_inputs.sections]
path = "okf-batched/state-v2/docs/${input.source.slug}/sections.json"

# NO knowledge concepts are written during scanning.
[[steps]]
id = "scan"
prompt_file = "flow/okf/flow_okf_from_doctrine_batched/prompts/01_scan.md"
foreach = "steps.scan_tasks.output.tasks"
iteration_id = "${item.id}"
json_restart_attempts = 1
output = "okf-batched/state-v2/docs/${input.source.slug}/scan-${iteration.id}.json"
overwrite_output = false
workspace_access = "read"
response_format = "json"
[steps.vars]
source = "${input.source}"
task = "${item}"

# Document-wide semantic consolidation runs AFTER all complete scans,
# and before any concept is written.
[[steps]]
id = "finish"
flow = "flow/okf/flow_okf_from_doctrine_batched/flows/finish-document.toml"
[steps.input]
source = "${input.source}"
scan_tasks = "${steps.scan_tasks.output}"
okf_root = "${input.okf_root}"

