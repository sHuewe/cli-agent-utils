version = 1
inputs = ["source", "okf_root"]
# Output is the compact JSON file inventory; the index writer executes
# afterwards and is a dependency for complete module navigation.
result = "steps.manifest_inventory.output"

[[steps]]
id = "sections"
output = "okf-batched/state/docs/${input.source.slug}/sections.json"
overwrite_output = false
[steps.filesystem_operation]
kind = "markdown_sections"
source_path = "${input.source.path}"
target_chars = 5000
max_sections = 512

[[steps]]
id = "direct"
when = { ref = "steps.sections.output.mode", eq = "direct" }
flow = "flow/okf/flow_okf_from_doctrine_batched/flows/process-section.toml"
[steps.input]
source = "${input.source}"
section = "null"
section_id = "direct"
okf_root = "${input.okf_root}"

[[steps]]
id = "sections_flow"
flow = "flow/okf/flow_okf_from_doctrine_batched/flows/process-section.toml"
foreach = "steps.sections.output.sections"
iteration_id = "${item.id}"
[steps.input]
source = "${input.source}"
section = "${item}"
section_id = "${item.id}"
okf_root = "${input.okf_root}"

[[steps]]
id = "manifest_inventory"
output = "okf-batched/state/docs/${input.source.slug}/manifest-inventory.json"
overwrite_output = true
[steps.filesystem_operation]
kind = "inventory"
directory = "okf-batched/state/docs/${input.source.slug}/manifests"
recursive = false
extensions = [".json"]
max_entries = 1000

[[steps]]
id = "module_index"
prompt_file = "flow/okf/flow_okf_from_doctrine_batched/prompts/06_module_index.md"
output = "okf-batched/state/docs/${input.source.slug}/module-index.json"
overwrite_output = false
workspace_access = "write"
response_format = "json"
approve_tools = ["os__make_directory","os__write_file"]
[steps.vars]
source = "${input.source}"
okf_root = "${input.okf_root}"
manifest_inventory = "${steps.manifest_inventory.output}"

