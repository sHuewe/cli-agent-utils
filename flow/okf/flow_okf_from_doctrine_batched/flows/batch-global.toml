version = 1
inputs = ["previous_batches", "stage", "next_stage"]
result = "steps.batch.output"

[[steps]]
id = "batch"
output = "okf-batched/state/global/batch-${input.next_stage}.json"
overwrite_output = false
[steps.json_operation]
kind = "batch_arrays"
input = "summaries"
array_paths = ["/groups", "/warnings"]
batch_size = 2
target_fragment_bytes = 2500
max_batch_bytes = 8000
[steps.json_inputs.summaries]
iterate = "input.previous_batches[]"
path = "okf-batched/state/global/${input.stage}-${each.id}.json"
