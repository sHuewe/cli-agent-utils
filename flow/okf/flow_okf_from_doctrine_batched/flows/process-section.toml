version = 1
inputs = ["source", "section", "section_id", "okf_root"]
result = "steps.manifest.output"

[checkpoint]
retain_intermediate = false
preserve_steps = ["manifest"]

[[steps]]
id = "scan"
json_restart_attempts = 1
prompt_file = "flow/okf/flow_okf_from_doctrine_batched/prompts/01_scan.md"
output = "okf-batched/state/docs/${input.source.slug}/scan-${input.section_id}.json"
overwrite_output = false
workspace_access = "read"
response_format = "json"
[steps.vars]
source = "${input.source}"
section = "${input.section}"
section_id = "${input.section_id}"

[[steps]]
id = "route"
prompt_file = "flow/okf/flow_okf_from_doctrine_batched/prompts/02_route.md"
output = "okf-batched/state/docs/${input.source.slug}/route-${input.section_id}.json"
overwrite_output = false
workspace_access = "none"
response_format = "json"
[steps.vars]
source = "${input.source}"
section_id = "${input.section_id}"
scan = "${steps.scan.output}"

[[steps]]
id = "topics"
prompt_file = "flow/okf/flow_okf_from_doctrine_batched/prompts/03_topics.md"
output = "okf-batched/state/docs/${input.source.slug}/topics-${input.section_id}.json"
overwrite_output = false
workspace_access = "none"
response_format = "json"
[steps.vars]
source = "${input.source}"
section_id = "${input.section_id}"
route = "${steps.route.output}"

[[steps]]
id = "assign"
prompt_file = "flow/okf/flow_okf_from_doctrine_batched/prompts/04_assign.md"
output = "okf-batched/state/docs/${input.source.slug}/assign-${input.section_id}.json"
overwrite_output = false
workspace_access = "none"
response_format = "json"
[steps.vars]
source = "${input.source}"
section_id = "${input.section_id}"
route = "${steps.route.output}"
topics = "${steps.topics.output}"

[[steps]]
id = "group"
output = "okf-batched/state/docs/${input.source.slug}/group-${input.section_id}.json"
overwrite_output = false
[steps.json_operation]
kind = "group_items"
input = "assignments"
max_concept_bytes = 12000
[steps.json_inputs.routes]
path = "okf-batched/state/docs/${input.source.slug}/route-${input.section_id}.json"
[steps.json_inputs.assignments]
path = "okf-batched/state/docs/${input.source.slug}/assign-${input.section_id}.json"
[steps.json_inputs.topics]
path = "okf-batched/state/docs/${input.source.slug}/topics-${input.section_id}.json"

[[steps]]
id = "build_concepts"
flow = "flow/okf/flow_okf_from_doctrine_batched/flows/build-concept.toml"
foreach = "steps.group.output.concepts"
iteration_id = "${item.id}"
[steps.input]
source = "${input.source}"
concept = "${item}"
okf_root = "${input.okf_root}"

[[steps]]
id = "coverage"
flow = "flow/okf/flow_okf_from_doctrine_batched/flows/verify-section.toml"
[steps.input]
source = "${input.source}"
section_id = "${input.section_id}"
concepts = "${steps.group.output.concepts}"

[[steps]]
id = "manifest"
prompt_file = "flow/okf/flow_okf_from_doctrine_batched/prompts/05_manifest.md"
output = "okf-batched/state/docs/${input.source.slug}/manifests/section-${input.section_id}.json"
overwrite_output = false
workspace_access = "none"
response_format = "json"
[steps.vars]
source = "${input.source}"
section_id = "${input.section_id}"
scan = "${steps.scan.output}"
plan = "${steps.group.output.concept_summaries}"
coverage = "${steps.coverage.output}"

