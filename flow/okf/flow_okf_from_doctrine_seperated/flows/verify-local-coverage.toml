version = 1
inputs = ["source", "concepts"]
result = "steps.coverage.output"
[[steps]]
id = "coverage"
output = "flow/okf/flow_okf_from_doctrine_seperated/state-semantic-v2/modules/${input.source.path}/coverage.json"
overwrite_output = false
[steps.json_operation]
kind = "verify_coverage"
input = "plan"
[steps.json_inputs.plan]
path = "flow/okf/flow_okf_from_doctrine_seperated/state-semantic-v2/modules/${input.source.path}/concept-plan-small-assign-v1.json"
[steps.json_inputs.results]
iterate = "input.concepts[]"
path = "flow/okf/flow_okf_from_doctrine_seperated/state-semantic-v2/modules/${input.source.path}/concept-${each.id}-repair.json"
