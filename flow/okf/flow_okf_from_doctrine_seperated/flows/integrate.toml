version = 1
inputs = ["sources", "okf_root"]
result = "steps.final.output"

# Read completed module manifests; no full doctrine contents are loaded here.
[[steps]]
id = "batch_modules"
output = "flow/okf/flow_okf_from_doctrine_seperated/state-semantic-v2/global/module-batches.json"
overwrite_output = true
[steps.json_operation]
kind = "batch"
input = "modules"
batch_size = 2
max_batch_bytes = 32000
[steps.json_inputs.modules]
iterate = "input.sources[]"
path = "flow/okf/flow_okf_from_doctrine_seperated/state-semantic-v2/modules/${each.path}/manifest.json"

[[steps]]
id = "suggest_themes"
prompt_file = "flow/okf/flow_okf_from_doctrine_seperated/prompts/07_global_suggest.md"
foreach = "steps.batch_modules.output.batches"
iteration_id = "${item.id}"
output = "flow/okf/flow_okf_from_doctrine_seperated/state-semantic-v2/global/suggestions-${iteration.id}.json"
overwrite_output = false
workspace_access = "none"
response_format = "json"
[steps.vars]
batch = "${item}"

[[steps]]
id = "batch_suggestions"
flow = "flow/okf/flow_okf_from_doctrine_seperated/flows/batch-global-suggestions.toml"
[steps.input]
batches = "${steps.batch_modules.output.batches}"

[[steps]]
id = "reduce_themes"
prompt_file = "flow/okf/flow_okf_from_doctrine_seperated/prompts/08_global_reduce.md"
foreach = "steps.batch_suggestions.output.batches"
iteration_id = "${item.id}"
output = "flow/okf/flow_okf_from_doctrine_seperated/state-semantic-v2/global/reduce-${iteration.id}.json"
overwrite_output = false
workspace_access = "none"
response_format = "json"
[steps.vars]
batch = "${item}"

# Consume compact per-batch proposals, not the original manifests.
[[steps]]
id = "theme_registry"
prompt_file = "flow/okf/flow_okf_from_doctrine_seperated/prompts/09_global_registry.md"
output = "flow/okf/flow_okf_from_doctrine_seperated/state-semantic-v2/global/theme-registry.json"
overwrite_output = false
workspace_access = "read"
response_format = "json"
[steps.vars]
reduced = "${steps.reduce_themes.output.iterations}"
okf_root = "${input.okf_root}"

# One manifest at a time; no cross-doctrine writing in assignment.
[[steps]]
id = "tag_modules"
when = { ref = "steps.theme_registry.output.status", eq = "ok" }
flow = "flow/okf/flow_okf_from_doctrine_seperated/flows/tag-module.toml"
foreach = "input.sources"
[steps.input]
source = "${item}"
okf_root = "${input.okf_root}"
themes = "${steps.theme_registry.output.themes}"

# Each theme is composed separately after all module tagging.
[[steps]]
id = "write_themes"
when = { ref = "steps.theme_registry.output.status", eq = "ok" }
flow = "flow/okf/flow_okf_from_doctrine_seperated/flows/write-theme.toml"
foreach = "steps.theme_registry.output.themes"
iteration_id = "${item.id}"
[steps.input]
theme = "${item}"
okf_root = "${input.okf_root}"

[[steps]]
id = "root_inventory"
output = "flow/okf/flow_okf_from_doctrine_seperated/state-semantic-v2/global/root-inventory.json"
overwrite_output = true
[steps.filesystem_operation]
kind = "inventory"
directory = "${input.okf_root}"
recursive = false
extensions = [".md"]
max_entries = 10000

[[steps]]
id = "root_index"
when = { ref = "steps.theme_registry.output.status", eq = "ok" }
prompt_file = "flow/okf/flow_okf_from_doctrine_seperated/prompts/13_root_index.md"
output = "flow/okf/flow_okf_from_doctrine_seperated/state-semantic-v2/global/root-index-result.json"
overwrite_output = false
workspace_access = "write"
response_format = "json"
approve_tools = ["os__write_file", "os__make_directory"]
[steps.vars]
okf_root = "${input.okf_root}"
inventory = "${steps.root_inventory.output}"
themes = "${steps.theme_registry.output.themes}"

[[steps]]
id = "final"
prompt_file = "flow/okf/flow_okf_from_doctrine_seperated/prompts/14_final.md"
output = "flow/okf/flow_okf_from_doctrine_seperated/state-semantic-v2/global/final.json"
overwrite_output = false
workspace_access = "read"
response_format = "json"
[steps.vars]
registry = "${steps.theme_registry.output}"
index = "${steps.root_index.output}"
theme_results = "${steps.write_themes.output.iterations}"
tag_results = "${steps.tag_modules.output.iterations}"
okf_root = "${input.okf_root}"
