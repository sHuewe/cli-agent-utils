version = 1
inputs = ["theme", "okf_root"]
result = "steps.verify.output"

[[steps]]
id = "write"
prompt_file = "flow/okf/flow_okf_from_doctrine_seperated/prompts/12_theme.md"
output = "flow/okf/flow_okf_from_doctrine_seperated/state-semantic-v2/global/theme-${input.theme.id}.json"
overwrite_output = false
workspace_access = "write"
response_format = "json"
approve_tools = ["os__make_directory", "os__write_file"]
[steps.vars]
theme = "${input.theme}"
okf_root = "${input.okf_root}"

[[steps]]
id = "verify"
prompt_file = "flow/okf/flow_okf_from_doctrine_seperated/prompts/15_verify_theme.md"
output = "flow/okf/flow_okf_from_doctrine_seperated/state-semantic-v2/global/theme-${input.theme.id}-verify.json"
overwrite_output = false
workspace_access = "read"
response_format = "json"
[steps.vars]
theme = "${input.theme}"
write = "${steps.write.output}"
okf_root = "${input.okf_root}"
