version = 1
exclude_paths = ["flow"]
result = "steps.complete_b.output"

# A is immutable. Python verifies its exact file contract before any LLM work.
[[steps]]
id = "inventory_tasks"
output = "okf-v4/state-b/inventory-tasks.json"
overwrite_output = true
[steps.python_script]
path = "flow/okf/v4/prepare_inventory.py"
timeout_seconds = 300

# Every concept gets a real LLM summary (never derived from its filename).
[[steps]]
id = "summarize"
foreach = "steps.inventory_tasks.output.concepts"
iteration_id = "${item.key}"
prompt_file = "flow/okf/v4/prompts/summarize_concept.md"
output_schema = "flow/okf/v4/schemas/concept-summary.schema.json"
output = "okf-v4/state-b/summaries/${iteration.id}.json"
overwrite_output = false
workspace_access = "read"
response_format = "json"
[steps.tool_policy]
allowed_tools = ["os__read_file"]
[steps.vars]
concept = "${item}"

# Quality proposals are JSON-only, and the LLM has read-only access.
# keep / rewrite / split are checked and applied by Python.
[[steps]]
id = "quality_review"
foreach = "steps.inventory_tasks.output.concepts"
iteration_id = "${item.key}"
prompt_file = "flow/okf/v4/prompts/review_concept.md"
add_file_context = ["flow/okf/okf-format.md"]
output_schema = "flow/okf/v4/schemas/concept-review.schema.json"
output = "okf-v4/state-b/reviews/${iteration.id}.json"
overwrite_output = false
workspace_access = "read"
response_format = "json"
[steps.tool_policy]
allowed_tools = ["os__read_file"]
[steps.vars]
concept = "${item}"

[[steps]]
id = "apply_quality"
output = "okf-v4/state-b/quality-result.json"
overwrite_output = true
[steps.python_script]
path = "flow/okf/v4/apply_quality.py"
timeout_seconds = 600
[steps.json_inputs.tasks]
path = "okf-v4/state-b/inventory-tasks.json"

# Identify candidate redundant concepts from LLM summary labels and
# their bounded semantic neighborhood; no full corpus in one LLM prompt.
[[steps]]
id = "merge_candidates"
output = "okf-v4/state-b/merge-candidates.json"
overwrite_output = true
[steps.python_script]
path = "flow/okf/v4/prepare_merges.py"
timeout_seconds = 300

[[steps]]
id = "merge_review"
foreach = "steps.merge_candidates.output.groups"
iteration_id = "${item.key}"
prompt_file = "flow/okf/v4/prompts/review_merge.md"
add_file_context = ["flow/okf/okf-format.md"]
output_schema = "flow/okf/v4/schemas/merge-review.schema.json"
output = "okf-v4/state-b/merges/${iteration.id}.json"
overwrite_output = false
workspace_access = "read"
response_format = "json"
[steps.tool_policy]
allowed_tools = ["os__read_file"]
[steps.vars]
group = "${item}"

# Validate all merge decisions and recheck exact source-item conservation.
# B produces revised concepts and a complete catalog, but *no indexes*.
[[steps]]
id = "apply_merges"
output = "okf-v4/state-b/merge-result.json"
overwrite_output = true
[steps.python_script]
path = "flow/okf/v4/apply_merges.py"
timeout_seconds = 600
[steps.json_inputs.groups]
path = "okf-v4/state-b/merge-candidates.json"

# Initial semantic verification identifies only concepts requiring repair.
# Its output is content-hash keyed to the complete source Knowledge Items.
[[steps]]
id = "initial_verification_tasks"
output = "okf-v4/state-b/initial-verification-tasks.json"
overwrite_output = true
[steps.python_script]
path = "flow/okf/v4/prepare_initial_verification.py"
timeout_seconds = 300

[[steps]]
id = "verify_final"
foreach = "steps.initial_verification_tasks.output.concepts"
iteration_id = "${item.key}"
prompt_file = "flow/okf/v4/prompts/verify_final.md"
output_schema = "flow/okf/v4/schemas/final-verification.schema.json"
output = "okf-v4/state-b/final/verification/${iteration.id}.json"
overwrite_output = false
workspace_access = "read"
response_format = "json"
[steps.tool_policy]
allowed_tools = ["os__read_file"]
[steps.vars]
concept = "${item}"

# Round one repairs only failed concepts. Every LLM edit is a proposal.
[[steps]]
id = "repair_candidates_1"
output = "okf-v4/state-b/repair-1/tasks.json"
overwrite_output = true
[steps.python_script]
path = "flow/okf/v4/repair_b.py"
args = ["--mode", "select", "--round", "1"]
timeout_seconds = 300

[[steps]]
id = "repair_review_1"
foreach = "steps.repair_candidates_1.output.concepts"
iteration_id = "${item.key}"
prompt_file = "flow/okf/v4/prompts/repair_concept.md"
add_file_context = ["flow/okf/okf-format.md"]
output_schema = "flow/okf/v4/schemas/concept-repair.schema.json"
output = "okf-v4/state-b/repair-1/proposals/${iteration.id}.json"
overwrite_output = false
workspace_access = "read"
response_format = "json"
[steps.tool_policy]
allowed_tools = ["os__read_file"]
[steps.vars]
concept = "${item}"

[[steps]]
id = "apply_repair_1"
output = "okf-v4/state-b/repair-1/apply-result.json"
overwrite_output = true
[steps.python_script]
path = "flow/okf/v4/repair_b.py"
args = ["--mode", "apply", "--round", "1"]
timeout_seconds = 600
[steps.json_inputs.tasks]
path = "okf-v4/state-b/repair-1/tasks.json"

[[steps]]
id = "repair_verification_tasks_1"
output = "okf-v4/state-b/repair-1/verification-tasks.json"
overwrite_output = true
[steps.python_script]
path = "flow/okf/v4/repair_b.py"
args = ["--mode", "verify-tasks", "--round", "1"]
timeout_seconds = 300
[steps.json_inputs.tasks]
path = "okf-v4/state-b/repair-1/tasks.json"

[[steps]]
id = "verify_repair_1"
foreach = "steps.repair_verification_tasks_1.output.concepts"
iteration_id = "${item.key}"
prompt_file = "flow/okf/v4/prompts/verify_final.md"
output_schema = "flow/okf/v4/schemas/final-verification.schema.json"
output = "okf-v4/state-b/repair-1/verification/${iteration.id}.json"
overwrite_output = false
workspace_access = "read"
response_format = "json"
[steps.tool_policy]
allowed_tools = ["os__read_file"]
[steps.vars]
concept = "${item}"

# A second and LAST attempt on still-unresolved concepts.
[[steps]]
id = "repair_candidates_2"
output = "okf-v4/state-b/repair-2/tasks.json"
overwrite_output = true
[steps.python_script]
path = "flow/okf/v4/repair_b.py"
args = ["--mode", "select", "--round", "2"]
timeout_seconds = 300

[[steps]]
id = "repair_review_2"
foreach = "steps.repair_candidates_2.output.concepts"
iteration_id = "${item.key}"
prompt_file = "flow/okf/v4/prompts/repair_concept.md"
add_file_context = ["flow/okf/okf-format.md"]
output_schema = "flow/okf/v4/schemas/concept-repair.schema.json"
output = "okf-v4/state-b/repair-2/proposals/${iteration.id}.json"
overwrite_output = false
workspace_access = "read"
response_format = "json"
[steps.tool_policy]
allowed_tools = ["os__read_file"]
[steps.vars]
concept = "${item}"

[[steps]]
id = "apply_repair_2"
output = "okf-v4/state-b/repair-2/apply-result.json"
overwrite_output = true
[steps.python_script]
path = "flow/okf/v4/repair_b.py"
args = ["--mode", "apply", "--round", "2"]
timeout_seconds = 600
[steps.json_inputs.tasks]
path = "okf-v4/state-b/repair-2/tasks.json"

[[steps]]
id = "repair_verification_tasks_2"
output = "okf-v4/state-b/repair-2/verification-tasks.json"
overwrite_output = true
[steps.python_script]
path = "flow/okf/v4/repair_b.py"
args = ["--mode", "verify-tasks", "--round", "2"]
timeout_seconds = 300
[steps.json_inputs.tasks]
path = "okf-v4/state-b/repair-2/tasks.json"

[[steps]]
id = "verify_repair_2"
foreach = "steps.repair_verification_tasks_2.output.concepts"
iteration_id = "${item.key}"
prompt_file = "flow/okf/v4/prompts/verify_final.md"
output_schema = "flow/okf/v4/schemas/final-verification.schema.json"
output = "okf-v4/state-b/repair-2/verification/${iteration.id}.json"
overwrite_output = false
workspace_access = "read"
response_format = "json"
[steps.tool_policy]
allowed_tools = ["os__read_file"]
[steps.vars]
concept = "${item}"

# Reconcile initial and both repair verifications. A valid old verdict only
# survives if the final concept/source fingerprint remains identical.
[[steps]]
id = "certify_repairs"
output = "okf-v4/state-b/final/repair-certification.json"
overwrite_output = true
[steps.python_script]
path = "flow/okf/v4/repair_b.py"
args = ["--mode", "certify"]
timeout_seconds = 300

# Final inventory is generated from the ACTUAL fully verified, repaired
# corpus, never the pre-repair B-merged snapshot.
[[steps]]
id = "final_inventory_tasks"
output = "okf-v4/state-b/final-inventory-tasks.json"
overwrite_output = true
[steps.python_script]
path = "flow/okf/v4/prepare_final_inventory.py"
timeout_seconds = 300

[[steps]]
id = "summarize_final"
foreach = "steps.final_inventory_tasks.output.concepts"
iteration_id = "${item.key}"
prompt_file = "flow/okf/v4/prompts/summarize_concept.md"
output_schema = "flow/okf/v4/schemas/concept-summary.schema.json"
output = "okf-v4/state-b/final/summaries/${iteration.id}.json"
overwrite_output = false
workspace_access = "read"
response_format = "json"
[steps.tool_policy]
allowed_tools = ["os__read_file"]
[steps.vars]
concept = "${item}"

# Complete B only after the fail-closed repair certification and summaries.
[[steps]]
id = "complete_b"
output = "okf-v4/state-b/complete-result.json"
overwrite_output = true
[steps.python_script]
path = "flow/okf/v4/complete_b.py"
timeout_seconds = 600
[steps.json_inputs.tasks]
path = "okf-v4/state-b/final-inventory-tasks.json"
[steps.json_inputs.certification]
path = "okf-v4/state-b/final/repair-certification.json"
