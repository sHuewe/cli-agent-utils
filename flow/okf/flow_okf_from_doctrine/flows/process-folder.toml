version = 1
inputs = ["folder", "structure", "doctrines", "scans", "doctrine_path", "okf_root"]
result = "steps.finalize.output"

[[steps]]
id = "batch_routes"
output = "flow/okf/flow_okf_from_doctrine/state/folder-routes-batches-v3-${input.folder.id}.json"
overwrite_output = false

[steps.json_operation]
kind = "batch"
input = "routes"
batch_size = 3
max_batch_bytes = 60000

[steps.json_inputs.routes]
iterate = "input.scans[].output.chunks[]"
path = "flow/okf/flow_okf_from_doctrine/state/routes/${each.document_id}-${each.id}-${input.folder.id}.json"

[[steps]]
id = "suggest_topics"
prompt_file = "flow/okf/flow_okf_from_doctrine/prompts/07a_suggest_batch_topics.md"
foreach = "steps.batch_routes.output.batches"
iteration_id = "${item.id}"
output = "flow/okf/flow_okf_from_doctrine/state/folder-topic-suggestions-v3-${input.folder.id}-${iteration.id}.json"
overwrite_output = false
workspace_access = "none"
response_format = "json"

[steps.vars]
folder = "${input.folder}"
batch = "${item}"

[[steps]]
id = "consolidate_topics"
prompt_file = "flow/okf/flow_okf_from_doctrine/prompts/07b_consolidate_folder_topics.md"
output = "flow/okf/flow_okf_from_doctrine/state/folder-topics-v3-${input.folder.id}.json"
overwrite_output = false
workspace_access = "none"
response_format = "json"

[steps.vars]
folder = "${input.folder}"
suggestions = "${steps.suggest_topics.output.iterations}"

[[steps]]
id = "assign_topics"
prompt_file = "flow/okf/flow_okf_from_doctrine/prompts/07c_assign_batch_topics.md"
foreach = "steps.batch_routes.output.batches"
iteration_id = "${item.id}"
output = "flow/okf/flow_okf_from_doctrine/state/folder-topic-assignment-v3-${input.folder.id}-${iteration.id}.json"
overwrite_output = false
workspace_access = "none"
response_format = "json"

[steps.vars]
folder = "${input.folder}"
batch = "${item}"
topics = "${steps.consolidate_topics.output}"

[[steps]]
id = "group_plan"
flow = "flow/okf/flow_okf_from_doctrine/flows/group-folder-plan.toml"

[steps.input]
folder = "${input.folder}"
scans = "${input.scans}"
assignments = "${steps.assign_topics.output.iterations}"

[[steps]]
id = "concepts"
flow = "flow/okf/flow_okf_from_doctrine/flows/process-concept.toml"
foreach = "steps.group_plan.output.concepts"
iteration_id = "${item.id}"

[steps.input]
concept = "${item}"
doctrine_path = "${input.doctrine_path}"
okf_root = "${input.okf_root}"
folder_id = "${input.folder.id}"

[[steps]]
id = "verify_coverage"
flow = "flow/okf/flow_okf_from_doctrine/flows/verify-folder-coverage.toml"

[steps.input]
folder = "${input.folder}"
concepts = "${steps.group_plan.output.concepts}"

[[steps]]
id = "finalize"
prompt_file = "flow/okf/flow_okf_from_doctrine/prompts/12_finalize_folder.md"
output = "flow/okf/flow_okf_from_doctrine/state/folder-v3-${input.folder.id}.json"
overwrite_output = false
response_format = "json"

[steps.vars]
folder = "${input.folder}"
plan = "${steps.group_plan.output.concept_summaries}"
coverage = "${steps.verify_coverage.output}"
concept_results = "${steps.verify_coverage.output}"
