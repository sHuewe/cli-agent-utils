version = 1
inputs = ["folder_scan", "structure", "okf_root"]
result = "steps.link_concepts.output"

[[steps]]
id = "link_concepts"
flow = "flow/okf/flow_okf_from_doctrine/flows/link-concept.toml"
foreach = "input.folder_scan.concept_paths"

[steps.input]
concept_path = "${item}"
concept_id = "${iteration.id}"
folder_id = "${input.folder_scan.folder_id}"
folder_status = "${input.folder_scan.status}"
structure = "${input.structure}"
okf_root = "${input.okf_root}"
