version = 1
inputs = ["folder", "concepts"]
result = "steps.verify.output"

[[steps]]
id = "verify"
output = "flow/okf/flow_okf_from_doctrine/state/coverage-v3-${input.folder.id}.json"
overwrite_output = false

[steps.json_operation]
kind = "verify_coverage"
input = "plan"

[steps.json_inputs.plan]
path = "flow/okf/flow_okf_from_doctrine/state/folder-plan-v3-${input.folder.id}.json"

[steps.json_inputs.results]
iterate = "input.concepts[]"
path = "flow/okf/flow_okf_from_doctrine/state/concepts/${input.folder.id}-${each.id}-repair.json"
