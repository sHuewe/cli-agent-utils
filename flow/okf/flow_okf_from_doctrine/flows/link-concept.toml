version = 1
inputs = ["concept_path", "concept_id", "folder_id", "folder_status", "structure", "okf_root", "target_folders"]
result = "steps.shared.output"

[[steps]]
id = "shared"
flow = "flow/okf/flows/link-concept.toml"
[steps.input]
concept_path = "${input.okf_root}/${input.concept_path}"
concept_id = "${input.concept_id}"
folder_id = "${input.folder_id}"
folder_status = "${input.folder_status}"
structure = "${input.structure}"
okf_root = "${input.okf_root}"
state_dir = "flow/okf/flow_okf_from_doctrine/state"
# The doctrine pipeline shares one state directory, so retain the historical
# folder/concept suffix for its checkpoint names.
checkpoint_key = "${input.folder_id}-${input.concept_id}"
target_folders = "${input.target_folders}"
# Semantic structure folder paths are relative to the OKF root.
target_path_prefix = "${input.okf_root}/"
