version = 1
# Read-only verification of historic per-concept link results. This is a
# standalone precheck building block, NOT a wrapper around link-concept:
# checkpoint_status protects the referenced concept against later writes in
# the same runner invocation. Do not combine this with a write-capable link
# step until the runner supports safe release of unsuccessful read guards.
inputs = ["concept_path", "state_dir", "checkpoint_key"]
result = "steps.check.output"

[[steps]]
id = "check"
output = "${input.state_dir}/resume-status-v1-${input.checkpoint_key}.json"
overwrite_output = true
[steps.filesystem_operation]
kind = "checkpoint_status"
paths = [
  "${input.state_dir}/verify-v2-${input.checkpoint_key}.json",
  "${input.state_dir}/verify-v3-${input.checkpoint_key}.json",
]
expected_status = "ok"
expected_source_path = "${input.concept_path}"
