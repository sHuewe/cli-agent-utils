version = 1
# exclude_paths = []  # inherited from the parent flow
inputs = ["concept_path", "okf_root", "scope_id", "concept_id"]
result = "steps.verify.output"

[retry]
max_attempts = 3
initial_delay_seconds = 1
backoff_multiplier = 2
max_delay_seconds = 10

[[steps]]
id = "assess"
prompt_file = "flow/okf/prompts/evaluate_concept_split.md"
add_file_context = ["flow/okf/okf-format.md"]
workspace_access = "read"
output = "flow/okf/state/fine/split-concept-assess-${input.scope_id}-${input.concept_id}.json"
overwrite_output = false
response_format = "json"

[steps.vars]
concept_path = "${input.concept_path}"
okf_root = "${input.okf_root}"

[[steps]]
id = "snapshot"
prompt_file = "flow/okf/prompts/snapshot_concept_before_split.md"
workspace_access = "read"
output = "flow/okf/state/fine/split-concept-snapshot-${input.scope_id}-${input.concept_id}.json"
overwrite_output = false
response_format = "json"

[steps.vars]
concept_path = "${input.concept_path}"
okf_root = "${input.okf_root}"
assessment = "${steps.assess.output}"

[[steps]]
id = "parts"
flow = "flow/okf/flows/split-part.toml"
foreach = "steps.assess.output.parts"
iteration_id = "${item.path}"

[steps.input]
part = "${item}"
part_id = "${iteration.id}"
concept_path = "${input.concept_path}"
concept_id = "${input.concept_id}"
scope_id = "${input.scope_id}"
okf_root = "${input.okf_root}"
assessment = "${steps.assess.output}"
snapshot_status = "${steps.snapshot.output.status}"
original_content = "${steps.snapshot.output.content}"

[[steps]]
id = "overview"
prompt_file = "flow/okf/prompts/update_split_overview.md"
add_file_context = ["flow/okf/okf-format.md"]
workspace_access = "write"
output = "flow/okf/state/fine/split-overview-v2-${input.scope_id}-${input.concept_id}.json"
overwrite_output = false
response_format = "json"
approve_tools = ["os__write_file"]

[steps.vars]
concept_path = "${input.concept_path}"
okf_root = "${input.okf_root}"
assessment = "${steps.assess.output}"
snapshot_status = "${steps.snapshot.output.status}"
original_content = "${steps.snapshot.output.content}"
parts = "${steps.parts.output.iterations}"

[[steps]]
id = "index"
prompt_file = "flow/okf/prompts/update_split_index.md"
workspace_access = "write"
output = "flow/okf/state/fine/split-index-v2-${input.scope_id}-${input.concept_id}.json"
overwrite_output = false
response_format = "json"
approve_tools = ["os__write_file"]

[steps.vars]
concept_path = "${input.concept_path}"
okf_root = "${input.okf_root}"
assessment = "${steps.assess.output}"
snapshot_status = "${steps.snapshot.output.status}"
index_path = "${steps.snapshot.output.index_path}"
index_content = "${steps.snapshot.output.index_content}"
parts = "${steps.parts.output.iterations}"
overview = "${steps.overview.output}"

[[steps]]
id = "apply"
prompt_file = "flow/okf/prompts/finalize_staged_split.md"
workspace_access = "none"
output = "flow/okf/state/fine/split-concept-apply-${input.scope_id}-${input.concept_id}.json"
overwrite_output = false
response_format = "json"

[steps.vars]
concept_path = "${input.concept_path}"
assessment = "${steps.assess.output}"
parts = "${steps.parts.output.iterations}"
overview = "${steps.overview.output}"
index = "${steps.index.output}"

[[steps]]
id = "verify"
prompt_file = "flow/okf/prompts/verify_concept_split.md"
add_file_context = ["flow/okf/okf-format.md"]
workspace_access = "read"
output = "flow/okf/state/fine/split-concept-verify-${input.scope_id}-${input.concept_id}.json"
overwrite_output = false
response_format = "json"

[steps.vars]
concept_path = "${input.concept_path}"
okf_root = "${input.okf_root}"
assessment = "${steps.assess.output}"
change = "${steps.apply.output}"
snapshot = "${steps.snapshot.output}"
