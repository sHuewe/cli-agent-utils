version = 1
# exclude_paths = []  # inherited from the parent flow
inputs = ["folder", "okf_root", "scope_id"]
result = "steps.split.output"

[retry]
max_attempts = 3
initial_delay_seconds = 1
backoff_multiplier = 2
max_delay_seconds = 10

[[steps]]
id = "inventory"
output = "flow/okf/state/fine/split-folder-inventory-${input.scope_id}-${input.folder.id}.json"
overwrite_output = true
[steps.filesystem_operation]
kind = "inventory"
directory = "${input.okf_root}/${input.folder.path}"
recursive = false
extensions = [".md"]
max_entries = 10000

[[steps]]
id = "discover"
prompt_file = "flow/okf/prompts/discover_concepts_for_split.md"
workspace_access = "read"
output = "flow/okf/state/fine/split-folder-discover-${input.scope_id}-${input.folder.id}.json"
overwrite_output = false
response_format = "json"

[steps.vars]
inventory = "${steps.inventory.output}"
folder = "${input.folder}"
okf_root = "${input.okf_root}"

[[steps]]
id = "split"
flow = "flow/okf/flows/split-concept.toml"
foreach = "steps.discover.output.concepts"
iteration_id = "${item.id}"

[steps.input]
concept_path = "${item.path}"
concept_id = "${item.id}"
scope_id = "${input.scope_id}-${input.folder.id}"
okf_root = "${input.okf_root}"
