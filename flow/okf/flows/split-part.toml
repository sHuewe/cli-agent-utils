version = 1
# One planned concept part per invocation; own checkpoint for safe resume.
inputs = ["part", "part_id", "concept_path", "concept_id", "scope_id", "okf_root", "assessment", "snapshot_status", "original_content"]
result = "steps.create.output"

[[steps]]
id = "create"
prompt_file = "flow/okf/prompts/create_split_part.md"
add_file_context = ["flow/okf/okf-format.md"]
workspace_access = "write"
output = "flow/okf/state/fine/split-part-create-v2-${input.scope_id}-${input.concept_id}-${input.part_id}.json"
overwrite_output = false
response_format = "json"
approve_tools = ["os__write_file"]

[steps.vars]
part = "${input.part}"
assessment = "${input.assessment}"
concept_path = "${input.concept_path}"
okf_root = "${input.okf_root}"
snapshot_status = "${input.snapshot_status}"
original_content = "${input.original_content}"
