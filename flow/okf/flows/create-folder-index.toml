version = 1
exclude_paths = []
inputs = ["folder", "structure"]
result = "steps.create.output"

[retry]
max_attempts = 3
initial_delay_seconds = 1
backoff_multiplier = 2
max_delay_seconds = 10

[[steps]]
id = "create"
prompt_file = "flow/okf/prompts/create_folder_index.md"
add_file_context = ["flow/okf/okf-format.md"]
workspace_access = "write"
response_format = "json"
approve_tools = ["os__make_directory", "os__write_file"]

[steps.vars]
folder = "${input.folder}"
structure = "${input.structure}"
