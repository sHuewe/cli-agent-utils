version = 1
[vars]
okf_root = "okf-generated"
exclude_paths = ["flow"]
result = "steps.link_folders.output"

[retry]
max_attempts = 3
initial_delay_seconds = 1
backoff_multiplier = 2
max_delay_seconds = 10

[[steps]]
id = "inventory"
output = "flow/okf/flow_okf_relink/state/inventory.json"
overwrite_output = true
[steps.filesystem_operation]
kind = "inventory"
directory = "okf-generated"
recursive = true
extensions = [".md"]
exclude_names = ["index.md", "log.md"]
max_entries = 10000

[[steps]]
id = "link_folders"
flow = "flow/okf/flow_okf_relink/flows/link-folder.toml"
foreach = "steps.inventory.output.directories"
iteration_id = "${iteration.id}"
[steps.input]
folder = "${item}"
folder_id = "${iteration.id}"
okf_root = "okf-generated"
