version = 1
inputs = ["concept", "folder", "folder_id", "concept_id", "okf_root"]
result = "steps.verify.output"

[[steps]]
id = "snapshot"
prompt_file = "flow/okf/flow_okf_relink/prompts/snapshot.md"
output = "flow/okf/flow_okf_relink/state/snapshot-${input.folder_id}-${input.concept_id}.json"
overwrite_output = false
workspace_access = "read"
response_format = "json"
[steps.vars]
concept = "${input.concept}"
okf_root = "${input.okf_root}"

[[steps]]
id = "link"
prompt_file = "flow/okf/flow_okf_relink/prompts/link.md"
output = "flow/okf/flow_okf_relink/state/link-${input.folder_id}-${input.concept_id}.json"
overwrite_output = false
workspace_access = "write"
response_format = "json"
approve_tools = ["os__write_file"]
[steps.vars]
concept = "${input.concept}"
folder = "${input.folder}"
okf_root = "${input.okf_root}"
snapshot = "${steps.snapshot.output}"

[[steps]]
id = "verify"
prompt_file = "flow/okf/flow_okf_relink/prompts/verify.md"
output = "flow/okf/flow_okf_relink/state/verify-${input.folder_id}-${input.concept_id}.json"
overwrite_output = false
workspace_access = "read"
response_format = "json"
[steps.vars]
concept = "${input.concept}"
okf_root = "${input.okf_root}"
link_result = "${steps.link.output}"
snapshot = "${steps.snapshot.output}"
