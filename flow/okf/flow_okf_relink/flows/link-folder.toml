version = 1
inputs = ["folder", "structure", "okf_root"]
result = "steps.link_concepts.output"

[[steps]]
id = "link_concepts"
flow = "flow/okf/flow_okf_relink/flows/link-concept.toml"
foreach = "input.folder.concept_paths"
iteration_id = "${iteration.id}"
[steps.input]
concept_path = "${item}"
