version = 1

# manual_path may point to one line-oriented text manual or to a directory
# containing several manuals. PDF input is intentionally unsupported here.
[vars]
manual_path = "manuals"
okf_root = "okf-generated"

[retry]
max_attempts = 3
initial_delay_seconds = 1
backoff_multiplier = 2
max_delay_seconds = 10

[[steps]]
id = "discover_manuals"
prompt_file = "flow/okf/flow_okf_from_manual/prompts/01_discover_manuals.md"
output = "flow/okf/flow_okf_from_manual/state/manuals.json"
overwrite_output = true
workspace_access = "read"
response_format = "json"

[[steps]]
id = "scan_manuals"
prompt_file = "flow/okf/flow_okf_from_manual/prompts/02_scan_manual.md"
foreach = "steps.discover_manuals.output.manuals"
iteration_id = "${item.id}"
output = "flow/okf/flow_okf_from_manual/state/scan-${iteration.id}.json"
overwrite_output = true
workspace_access = "read"
response_format = "json"

[steps.vars]
manual = "${item}"

[[steps]]
id = "plan_concepts"
prompt_file = "flow/okf/flow_okf_from_manual/prompts/03_plan_concepts.md"
add_file_context = ["flow/okf/okf-format.md"]
output = "flow/okf/flow_okf_from_manual/state/plan.json"
overwrite_output = true
workspace_access = "none"
response_format = "json"

[steps.vars]
project = "${steps.discover_manuals.output.project}"
manual_scans = "${steps.scan_manuals.output.iterations}"

[[steps]]
id = "build_concepts"
prompt_file = "flow/okf/flow_okf_from_manual/prompts/04_build_concept.md"
add_file_context = ["flow/okf/okf-format.md"]
foreach = "steps.plan_concepts.output.concepts"
iteration_id = "${item.id}"
output = "flow/okf/flow_okf_from_manual/state/build-${iteration.id}.json"
overwrite_output = true
workspace_access = "write"
response_format = "json"
approve_tools = ["os__make_directory", "os__write_file"]

[steps.vars]
concept = "${item}"

[[steps]]
id = "verify_concepts"
prompt_file = "flow/okf/flow_okf_from_manual/prompts/05_verify_concept.md"
add_file_context = ["flow/okf/okf-format.md"]
foreach = "steps.build_concepts.output.iterations"
iteration_id = "${item.id}"
output = "flow/okf/flow_okf_from_manual/state/verify-${iteration.id}.json"
overwrite_output = true
workspace_access = "read"
response_format = "json"

[steps.vars]
build = "${item.output}"

[[steps]]
id = "repair_concepts"
prompt_file = "flow/okf/flow_okf_from_manual/prompts/06_repair_concept.md"
add_file_context = ["flow/okf/okf-format.md"]
foreach = "steps.verify_concepts.output.iterations"
iteration_id = "${item.id}"
output = "flow/okf/flow_okf_from_manual/state/repair-${iteration.id}.json"
overwrite_output = true
workspace_access = "write"
response_format = "json"
approve_tools = ["os__write_file"]

[steps.vars]
verification = "${item.output}"

# Deliberately resumable/editable. Users may add requested concepts before a
# later run; an existing valid JSON file is then consumed as a checkpoint.
[[steps]]
id = "additional_concepts"
prompt_file = "flow/okf/prompts/additional_concepts.md"
add_file_context = ["flow/okf/okf-format.md"]
output = "flow/okf/flow_okf_from_manual/state/additional-concepts.json"
overwrite_output = false
workspace_access = "read"
response_format = "json"

[steps.vars]
plans = "${steps.plan_concepts.output}"
results = "${steps.repair_concepts.output.iterations}"

[[steps]]
id = "assess_additional_concepts"
prompt_file = "flow/okf/flow_okf_from_manual/prompts/07_assess_additional_concept.md"
add_file_context = ["flow/okf/okf-format.md"]
foreach = "steps.additional_concepts.output.concepts"
iteration_id = "${item.id}"
output = "flow/okf/flow_okf_from_manual/state/assess-${iteration.id}.json"
overwrite_output = true
workspace_access = "read"
response_format = "json"

[steps.vars]
requested_concept = "${item}"
concept_map = "${steps.plan_concepts.output.concepts}"
manuals = "${steps.discover_manuals.output.manuals}"

[[steps]]
id = "apply_additional_concepts"
prompt_file = "flow/okf/flow_okf_from_manual/prompts/08_apply_additional_concept.md"
add_file_context = ["flow/okf/okf-format.md"]
foreach = "steps.assess_additional_concepts.output.iterations"
iteration_id = "${item.id}"
output = "flow/okf/flow_okf_from_manual/state/apply-${iteration.id}.json"
overwrite_output = true
workspace_access = "write"
response_format = "json"
approve_tools = ["os__make_directory", "os__write_file"]

[steps.vars]
assessment = "${item.output}"

[[steps]]
id = "create_root_index"
prompt_file = "flow/okf/prompts/create_root_index.md"
add_file_context = ["flow/okf/okf-format.md"]
output = "flow/okf/flow_okf_from_manual/state/root-index.json"
overwrite_output = true
workspace_access = "write"
response_format = "json"
approve_tools = ["os__make_directory", "os__write_file"]

[steps.vars]
project = "${steps.discover_manuals.output.project}"
primary_results = "${steps.repair_concepts.output.iterations}"
additional_changes = "${steps.apply_additional_concepts.output.iterations}"

[[steps]]
id = "final_verify"
prompt_file = "flow/okf/prompts/final_verify.md"
add_file_context = ["flow/okf/okf-format.md"]
output = "flow/okf/flow_okf_from_manual/state/final-verification.json"
overwrite_output = true
workspace_access = "read"
response_format = "json"

[steps.vars]
root_index = "${steps.create_root_index.output}"
