version = 1
exclude_paths = []

[vars]
manual_path = "manuals"
okf_root = "okf-generated"

[retry]
max_attempts = 3
initial_delay_seconds = 1
backoff_multiplier = 2
max_delay_seconds = 10

[[steps]]
id = "discover_manuals"
prompt_file = "flow/okf/flow_okf_from_manual/prompts/01_discover_manuals.md"
output = "flow/okf/flow_okf_from_manual/state/manuals.json"
overwrite_output = false
workspace_access = "read"
response_format = "json"

[[steps]]
id = "scan_manuals"
prompt_file = "flow/okf/flow_okf_from_manual/prompts/02_scan_manual.md"
foreach = "steps.discover_manuals.output.manuals"
iteration_id = "${item.id}"
output = "flow/okf/flow_okf_from_manual/state/scan-${iteration.id}.json"
overwrite_output = false
workspace_access = "read"
response_format = "json"

[steps.vars]
manual = "${item}"

[[steps]]
id = "summarize_scans"
prompt_file = "flow/okf/flow_okf_from_manual/prompts/03_summarize_scan.md"
foreach = "steps.scan_manuals.output.iterations"
iteration_id = "${item.id}"
output = "flow/okf/flow_okf_from_manual/state/profile-${iteration.id}.json"
overwrite_output = false
workspace_access = "none"
response_format = "json"

[steps.vars]
scan = "${item.output}"

[[steps]]
id = "design_structure"
prompt_file = "flow/okf/prompts/design_structure.md"
add_file_context = ["flow/okf/okf-format.md"]
output = "flow/okf/flow_okf_from_manual/state/structure.json"
overwrite_output = false
workspace_access = "none"
response_format = "json"

[steps.vars]
source_kind = "manuals"
project = "${steps.discover_manuals.output.project}"
analysis_profiles = "${steps.summarize_scans.output.iterations}"

[[steps]]
id = "route_manuals"
flow = "flow/okf/flow_okf_from_manual/flows/route-manual.toml"
foreach = "steps.scan_manuals.output.iterations"
iteration_id = "${item.id}"

[steps.input]
scan = "${item.output}"
structure = "${steps.design_structure.output}"

[[steps]]
id = "process_folders"
flow = "flow/okf/flow_okf_from_manual/flows/process-folder.toml"
foreach = "steps.design_structure.output.folders"
iteration_id = "${item.id}"

[steps.input]
folder = "${item}"
structure = "${steps.design_structure.output}"
manuals = "${steps.discover_manuals.output.manuals}"
manual_path = "${steps.discover_manuals.output.manual_path}"
okf_root = "${steps.design_structure.output.okf_root}"

[[steps]]
id = "additional_concepts"
prompt_file = "flow/okf/prompts/additional_concepts.md"
add_file_context = ["flow/okf/okf-format.md"]
output = "flow/okf/flow_okf_from_manual/state/additional-concepts.json"
overwrite_output = false
workspace_access = "read"
response_format = "json"

[steps.vars]
structure = "${steps.design_structure.output}"
plans = "${steps.process_folders.output.iterations}"
results = "${steps.process_folders.output.iterations}"

[[steps]]
id = "assess_additional_concepts"
prompt_file = "flow/okf/flow_okf_from_manual/prompts/13_assess_additional_concept.md"
add_file_context = ["flow/okf/okf-format.md"]
foreach = "steps.additional_concepts.output.concepts"
iteration_id = "${item.id}"
output = "flow/okf/flow_okf_from_manual/state/assess-${iteration.id}.json"
overwrite_output = false
workspace_access = "read"
response_format = "json"

[steps.vars]
requested_concept = "${item}"
structure = "${steps.design_structure.output}"
manuals = "${steps.discover_manuals.output.manuals}"

[[steps]]
id = "apply_additional_concepts"
prompt_file = "flow/okf/flow_okf_from_manual/prompts/14_apply_additional_concept.md"
add_file_context = ["flow/okf/okf-format.md"]
foreach = "steps.assess_additional_concepts.output.iterations"
iteration_id = "${item.id}"
output = "flow/okf/flow_okf_from_manual/state/apply-${iteration.id}.json"
overwrite_output = false
workspace_access = "write"
response_format = "json"
approve_tools = ["os__make_directory", "os__write_file"]

[steps.vars]
assessment = "${item.output}"

[[steps]]
id = "create_folder_indexes"
flow = "flow/okf/flows/create-folder-index.toml"
foreach = "steps.design_structure.output.folders"
iteration_id = "${item.id}"

[steps.input]
folder = "${item}"
structure = "${steps.design_structure.output}"

[[steps]]
id = "create_root_index"
prompt_file = "flow/okf/prompts/create_root_index.md"
add_file_context = ["flow/okf/okf-format.md"]
output = "flow/okf/flow_okf_from_manual/state/root-index.json"
overwrite_output = false
workspace_access = "write"
response_format = "json"
approve_tools = ["os__make_directory", "os__write_file"]

[steps.vars]
project = "${steps.discover_manuals.output.project}"
structure = "${steps.design_structure.output}"
folder_indexes = "${steps.create_folder_indexes.output.iterations}"

[[steps]]
id = "verify_folders"
flow = "flow/okf/flows/verify-folder.toml"
foreach = "steps.design_structure.output.folders"
iteration_id = "${item.id}"

[steps.input]
folder = "${item}"
structure = "${steps.design_structure.output}"

[[steps]]
id = "final_verify"
prompt_file = "flow/okf/prompts/final_verify.md"
add_file_context = ["flow/okf/okf-format.md"]
output = "flow/okf/flow_okf_from_manual/state/final-verification.json"
overwrite_output = false
workspace_access = "read"
response_format = "json"

[steps.vars]
structure = "${steps.design_structure.output}"
navigation = "${steps.create_root_index.output}"
folder_verifications = "${steps.verify_folders.output.iterations}"

[[steps]]
id = "split_concepts"
flow = "flow/okf/flows/split-folder.toml"
foreach = "steps.design_structure.output.folders"
iteration_id = "${item.id}"

[steps.input]
folder = "${item}"
okf_root = "${steps.design_structure.output.okf_root}"

[[steps]]
id = "post_split_verify_folders"
flow = "flow/okf/flows/verify-folder.toml"
foreach = "steps.design_structure.output.folders"
iteration_id = "${item.id}"

[steps.input]
folder = "${item}"
structure = "${steps.design_structure.output}"

[[steps]]
id = "post_split_final_verify"
prompt_file = "flow/okf/prompts/post_split_final_verify.md"
add_file_context = ["flow/okf/okf-format.md"]
output = "flow/okf/flow_okf_from_manual/state/post-split-final-verification.json"
overwrite_output = true
workspace_access = "read"
response_format = "json"

[steps.vars]
structure = "${steps.design_structure.output}"
navigation = "${steps.create_root_index.output}"
okf_root = "${steps.design_structure.output.okf_root}"
folder_verifications = "${steps.post_split_verify_folders.output.iterations}"
split_verifications = "${steps.split_concepts.output.iterations}"

