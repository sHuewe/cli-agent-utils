version = 1
exclude_paths = []
inputs = ["folder", "structure", "manuals", "manual_path", "okf_root"]
result = "steps.finalize.output"

[retry]
max_attempts = 3
initial_delay_seconds = 1
backoff_multiplier = 2
max_delay_seconds = 10

[[steps]]
id = "plan"
prompt_file = "flow/okf/flow_okf_from_manual/prompts/07_plan_folder.md"
add_file_context = ["flow/okf/okf-format.md"]
output = "flow/okf/flow_okf_from_manual/state/folder-plan-${input.folder.id}.json"
overwrite_output = false
workspace_access = "read"
response_format = "json"

[steps.vars]
folder = "${input.folder}"
structure = "${input.structure}"
manuals = "${input.manuals}"
okf_root = "${input.okf_root}"

[[steps]]
id = "concepts"
flow = "process-concept.toml"
foreach = "steps.plan.output.concepts"
iteration_id = "${item.id}"

[steps.input]
concept = "${item}"
manual_path = "${input.manual_path}"
okf_root = "${input.okf_root}"
folder_id = "${input.folder.id}"

[[steps]]
id = "verify_coverage"
prompt_file = "flow/okf/flow_okf_from_manual/prompts/11_verify_coverage.md"
output = "flow/okf/flow_okf_from_manual/state/coverage-${input.folder.id}.json"
overwrite_output = false
response_format = "json"

[steps.vars]
folder = "${input.folder}"
plan = "${steps.plan.output}"
concept_results = "${steps.concepts.output}"

[[steps]]
id = "finalize"
prompt_file = "flow/okf/flow_okf_from_manual/prompts/12_finalize_folder.md"
output = "flow/okf/flow_okf_from_manual/state/folder-${input.folder.id}.json"
overwrite_output = false
response_format = "json"

[steps.vars]
folder = "${input.folder}"
plan = "${steps.plan.output}"
coverage = "${steps.verify_coverage.output}"
concept_results = "${steps.concepts.output}"
