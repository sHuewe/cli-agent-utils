version = 1
inputs = ["manual"]
result = "steps.summarize_document.output"

[retry]
max_attempts = 3
initial_delay_seconds = 1
backoff_multiplier = 2
max_delay_seconds = 10

[[steps]]
id = "partition"
prompt_file = "flow/okf/common/prompts/01_partition_document.md"
output = "flow/okf/flow_okf_from_manual/state/partition-${input.manual.id}.json"
overwrite_output = false
workspace_access = "read"
response_format = "json"

[steps.vars]
document = "${input.manual}"

[[steps]]
id = "scan_chunks"
prompt_file = "flow/okf/flow_okf_from_manual/prompts/02_scan_chunk.md"
foreach = "steps.partition.output.chunks"
iteration_id = "${item.id}"
output = "flow/okf/flow_okf_from_manual/state/chunks/scan-${input.manual.id}-${iteration.id}.json"
overwrite_output = false
workspace_access = "read"
response_format = "json"

[steps.vars]
chunk = "${item}"

[[steps]]
id = "chunk_profiles"
prompt_file = "flow/okf/common/prompts/02_summarize_chunk.md"
foreach = "steps.scan_chunks.output.iterations"
iteration_id = "${item.id}"
output = "flow/okf/flow_okf_from_manual/state/chunks/profile-${input.manual.id}-${iteration.id}.json"
overwrite_output = false
workspace_access = "none"
response_format = "json"

[steps.vars]
scan = "${item.output}"

[[steps]]
id = "summarize_document"
prompt_file = "flow/okf/common/prompts/03_summarize_document.md"
output = "flow/okf/flow_okf_from_manual/state/profile-v2-${input.manual.id}.json"
overwrite_output = false
workspace_access = "none"
response_format = "json"

[steps.vars]
partition = "${steps.partition.output}"
profiles = "${steps.chunk_profiles.output.iterations}"
