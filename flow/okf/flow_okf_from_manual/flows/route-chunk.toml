version = 1
inputs = ["chunk", "structure"]
result = "steps.finalize.output"

[retry]
max_attempts = 3
initial_delay_seconds = 1
backoff_multiplier = 2
max_delay_seconds = 10

[[steps]]
id = "folders"
prompt_file = "flow/okf/flow_okf_from_manual/prompts/04_emit_folders.md"
output = "flow/okf/flow_okf_from_manual/state/fine/folders-${input.chunk.document_id}-${input.chunk.id}.json"
overwrite_output = false
response_format = "json"

[steps.vars]
structure = "${input.structure}"

[[steps]]
id = "route"
prompt_file = "flow/okf/flow_okf_from_manual/prompts/05_route_chunk.md"
foreach = "steps.folders.output.folders"
iteration_id = "${item.id}"
output = "flow/okf/flow_okf_from_manual/state/routes/${input.chunk.document_id}-${input.chunk.id}-${iteration.id}.json"
overwrite_output = false
workspace_access = "read"
response_format = "json"

[steps.vars]
chunk = "${input.chunk}"
folder = "${item}"
structure = "${input.structure}"

[[steps]]
id = "finalize"
prompt_file = "flow/okf/flow_okf_from_manual/prompts/06_finalize_routing.md"
output = "flow/okf/flow_okf_from_manual/state/fine/finalize-${input.chunk.document_id}-${input.chunk.id}.json"
overwrite_output = false
response_format = "json"

[steps.vars]
manual = "${input.chunk}"
structure = "${input.structure}"
