version = 1
# exclude_paths = []  # inherited from the parent flow
inputs = ["question", "question_id", "manual_path", "okf_root"]
result = "steps.verify.output"

[retry]
max_attempts = 3
initial_delay_seconds = 1
backoff_multiplier = 2
max_delay_seconds = 10

[[steps]]
id = "assess"
prompt_file = "flow/okf/prompts/questions_assess.md"
output = "flow/okf/flow_okf_from_manual/state/questions/assess-${input.question_id}.json"
overwrite_output = false
workspace_access = "read"
response_format = "json"

[steps.vars]
okf_root = "${input.okf_root}"
question = "${input.question}"

[[steps]]
id = "evidence"
prompt_file = "flow/okf/flow_okf_from_manual/prompts/15_question_evidence.md"
output = "flow/okf/flow_okf_from_manual/state/questions/evidence-${input.question_id}.json"
overwrite_output = false
workspace_access = "read"
response_format = "json"

[steps.vars]
manual_path = "${input.manual_path}"
question = "${input.question}"
assessment = "${steps.assess.output}"

[[steps]]
id = "apply"
prompt_file = "flow/okf/prompts/questions_apply.md"
add_file_context = ["flow/okf/okf-format.md"]
output = "flow/okf/flow_okf_from_manual/state/questions/apply-${input.question_id}.json"
overwrite_output = false
workspace_access = "write"
response_format = "json"
approve_tools = ["os__make_directory", "os__write_file"]

[steps.vars]
okf_root = "${input.okf_root}"
question = "${input.question}"
assessment = "${steps.assess.output}"
evidence = "${steps.evidence.output}"

[[steps]]
id = "verify"
prompt_file = "flow/okf/prompts/questions_verify.md"
output = "flow/okf/flow_okf_from_manual/state/questions/verify-${input.question_id}.json"
overwrite_output = false
workspace_access = "read"
response_format = "json"

[steps.vars]
okf_root = "${input.okf_root}"
question = "${input.question}"
change = "${steps.apply.output}"
