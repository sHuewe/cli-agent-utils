version = 1
inputs = ["batches"]
result = "steps.batch.output"

[[steps]]
id = "batch"
output = "rag-goldens/state/topics/candidate-batches.json"
overwrite_output = false
# Each generated cross-document group is indivisible; split whole groups
# (and warnings) before bounded repacking, without dropping provenance.
[steps.json_operation]
kind = "batch_arrays"
array_paths = ["/groups", "/warnings"]
target_fragment_bytes = 12000
input = "candidates"
batch_size = 5
max_batch_bytes = 30000
[steps.json_inputs.candidates]
iterate = "input.batches[]"
path = "rag-goldens/state/topics/candidates-${each.id}.json"
