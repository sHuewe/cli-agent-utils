version = 1
inputs = ["batches"]
result = "steps.batch.output"

# The final registry LLM sees no more than 3 reduced summaries AND 24 KiB.
# In particular, the full list of second-stage reductions is NEVER rendered
# into one prompt, regardless of how many source doctrines are indexed.
[[steps]]
id = "batch"
output = "rag-goldens/state/topics/registry-batches.json"
overwrite_output = false
# Small batches keep the generation/context work below provider timeout
# thresholds. Groups and their evidence remain indivisible; no truncation.
# Changes to packing require invalidating this stage and its downstream
# checkpoints, but never the already generated candidates-*.json files.
[steps.json_operation]
kind = "batch_arrays"
array_paths = ["/groups", "/warnings"]
target_fragment_bytes = 5000
input = "summaries"
batch_size = 2
max_batch_bytes = 12000
[steps.json_inputs.summaries]
iterate = "input.batches[]"
path = "rag-goldens/state/topics/reduce2-${each.id}.json"
