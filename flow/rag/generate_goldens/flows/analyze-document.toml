version = 1
inputs = ["source"]
result = "steps.profile_inventory.output"

# Deterministic sectioning. Each source section is then handled through
# small, independently checkpointed discovery, evidence, and assembly calls.
[[steps]]
id = "sections"
output = "rag-goldens/state/docs/${input.source.slug}/sections.json"
overwrite_output = false
[steps.filesystem_operation]
kind = "markdown_sections"
source_path = "${input.source.path}"
target_chars = 12000
max_sections = 512

# Short doctrines take the same two-stage analysis path as longer sections.
[[steps]]
id = "direct_topics"
when = { ref = "steps.sections.output.mode", eq = "direct" }
flow = "flow/rag/generate_goldens/flows/scan-section.toml"
[steps.input]
source = "${input.source}"
section = "null"
scan_id = "direct"
output_kind = "document_profile"
profile_path = "rag-goldens/state/docs/${input.source.slug}/profiles/direct.json"
output_file = "profiles/direct.json"

# Each source section has independent discovery, per-topic enrichment, and
# deterministic checkpoint paths. The child result still has the legacy
# scan-<section>.json schema expected by the existing consolidation stages.
[[steps]]
id = "section_topics"
flow = "flow/rag/generate_goldens/flows/scan-section.toml"
foreach = "steps.sections.output.sections"
iteration_id = "${item.id}"
[steps.input]
source = "${input.source}"
section = "${item}"
scan_id = "${item.id}"
output_kind = "section_topics"
profile_path = "null"
output_file = "scan-${item.id}.json"

[[steps]]
id = "consolidate_sections"
when = { ref = "steps.sections.output.mode", eq = "sections" }
flow = "flow/rag/generate_goldens/flows/consolidate-document.toml"
[steps.input]
source = "${input.source}"
sections = "${steps.sections.output.sections}"

# Only final profile shards reside in profiles/, never incomplete discovery
# or evidence steps; inventory is deterministic and refreshed each run.
[[steps]]
id = "profile_inventory"
output = "rag-goldens/state/docs/${input.source.slug}/profile-inventory.json"
overwrite_output = true
[steps.filesystem_operation]
kind = "inventory"
directory = "rag-goldens/state/docs/${input.source.slug}/profiles"
recursive = false
extensions = [".json"]
max_entries = 1000
