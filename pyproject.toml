[project]
name = "cli-agent-utils-workspace"
version = "0.0.0"
description = "Non-installable development workspace for independent MCP projects"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["mcp/*"]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]
